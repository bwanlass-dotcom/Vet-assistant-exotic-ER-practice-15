{q:'What is the best assistant handoff?',a:['“Thumper has GI stasis; start medication now.”','“Thumper ate approximately one-quarter of his usual portion and has fewer droppings; veterinarian notified.”','“Thumper seems sad but should improve.”'],correct:1,why:'A useful handoff states observable facts and whom you notified, without diagnosing or prescribing.'}]},

{q:'What is the safest immediate assistant response?',a:['Increase pressure around the chest to stop movement.','Pause restraint, remove any restriction on chest movement, and immediately alert the veterinarian.','Continue the exam to avoid delay.'],correct:1,why:'Birds need chest movement for breathing. Do not compress the chest; urgent distress requires immediate veterinary attention.'},

{q:'Which owner question gathers the most useful information?',a:['“Do you think Peanut is cute?”','“What specific foods, quantities and supplements does Peanut receive each day?”','“Would you like me to prescribe a new diet?”'],correct:1,why:'Specific diet histories are more useful than assumptions. Document food types, amounts, freshness and supplements.'},

{q:'Two mice are huddled, unusually quiet and have ruffled coats. What is the correct response?',a:['Record the objective findings and promptly alert the designated supervisor.','Assume they are healthy because they are quiet.','Change the approved study procedure yourself.'],correct:0,why:'Prey animals may hide illness. Unexpected changes in posture, coat and activity must be reported promptly through the designated chain.'},

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pct(){return Math.round(state.done.filter(Boolean).length/6*100)}
function render(){let a=document.getElementById('app');let n=state.mission;if(n<0){a.innerHTML=`<section class="hero"><div class="heroPhoto" style="background-image:url('${ART.hero}')"></div><div class="heroText"><div class="eyebrow">Cedar Creek Exotic Animal Hospital · Module 15</div><h1>The Exotic ER:<br><span style="color:#add6ce">Your First Shift</span></h1><p>Clock in as a veterinary assistant. Investigate six realistic cases, inspect clinic records, recognize warning signs, protect patient welfare and report what you observe. No guessing diagnoses or prescribing treatments.</p><button class="btn" onclick="start()">▶ ${state.started?'Continue Your Shift':'Begin Your Shift'}</button></div></section><div class="progress"><strong>Shift Progress · ${state.done.filter(Boolean).length}/6 missions</strong><div class="track"><div class="fill" style="width:${pct()}%"></div></div><strong>${pct()}%</strong></div><h2 class="sectionTitle">🐾 Your Clinical Cases</h2><div class="grid">${missions.map((m,i)=>`<article class="case"><img alt="Photorealistic scene of ${esc(m.patient)}" src="${m.photo}"><div class="content"><span class="pill">Mission ${i+1} ${state.done[i]?'· ✓ Completed':''}</span><h3>${esc(m.title)}</h3><p>${esc(m.subtitle)}</p><button class="btn" onclick="go(${i})">${state.done[i]?'Review Mission':'Open Patient File'} →</button></div></article>`).join('')}</div>${pct()===100?certificate():''}<p class="muted" style="margin-top:20px">Progress saves automatically in this browser when local storage is available. Complete all six missions to reveal the completion word. This is an educational simulation, not a treatment protocol.</p>`;return}
let m=missions[n],t=m.tasks[state.step],key=n+'-'+state.step;let inspected=m.evidence.some(e=>state.seen[e[1]]);a.innerHTML=`<button class="btn alt" onclick="home()">← Back to Clinic</button><div class="progress"><strong>Mission ${n+1}/6 · ${state.done.filter(Boolean).length} completed</strong><div class="track"><div class="fill" style="width:${pct()}%"></div></div><strong>${pct()}%</strong></div><section class="panel"><div class="missionhead"><div><div class="eyebrow" style="color:#a35661">Mission ${n+1} · Patient File</div><h2>${esc(m.title)}</h2><strong>${esc(m.patient)}</strong><p class="sub">${esc(m.subtitle)}</p><div class="hint"><strong>Supervisor's briefing:</strong> Inspect the evidence before making decisions. Observe → Identify → Protect → Document → Report.</div></div><img alt="Realistic animal patient or clinic scene" src="${m.photo}"></div><h3>🔎 Inspect Clinical Evidence</h3><div class="evidence">${m.evidence.map(e=>`<button class="${state.seen[e[1]]?'seen':''}" onclick="openDoc('${e[1]}')">${state.seen[e[1]]?'✓':'📋'} ${esc(e[0])}<small>${state.seen[e[1]]?'Reviewed':'Click to inspect'}</small></button>`).join('')}</div><div class="task"><span class="pill">Clinical Decision ${state.step+1} of ${m.tasks.length}</span><h3>${esc(t.q)}</h3><div class="choices">${t.a.map((c,i)=>`<button class="choice ${state.selected===i?'sel':''}" onclick="choose(${i})" ${state.feedback?'disabled':''}><span class="letter">${'ABC'[i]}</span><span>${esc(c)}</span></button>`).join('')}</div>${!inspected?'<p class="muted">🔒 Open at least one clinical evidence document before submitting your decision.</p>':''}${state.feedback?`<div class="feedback ${state.feedback.ok?'ok':'no'}" role="status"><strong>${state.feedback.ok?'✓ Supervisor approved':'↻ Supervisor coaching'}</strong><p>${esc(state.feedback.ok?t.why:state.feedback.message)}</p></div>`:''}<div class="nav">${!state.feedback?`<button class="btn" onclick="submitDecision()" ${state.selected===null||!inspected?'disabled':''}>Submit Decision</button>`:state.feedback.ok?`<button class="btn" onclick="nextStep()">${state.step===2?'Complete Mission':'Next Decision'} →</button>`:`<button class="btn rose" onclick="retry()">Try Again ↻</button>`}<button class="btn alt" onclick="openGuide()">View Field Guide</button></div></div></section>`}
function certificate(){return `<section class="certificate" style="margin-top:22px"><div class="eyebrow">Shift successfully completed</div><h2>🏅 Exotic ER — Clinical Readiness</h2><p>You completed all six missions and demonstrated safe observation, species-specific thinking, welfare awareness and accurate communication.</p><p>Your secret Canvas completion word is:</p><div class="word">EXOTICCARE</div><p>Enter this word in your Module 15 Canvas Practice & Demonstrate quiz.</p><button class="btn alt" onclick="copyWord()">Copy Completion Word</button></section>`}
function copyWord(){if(navigator.clipboard)navigator.clipboard.writeText('EXOTICCARE').then(()=>alert('Completion word copied!')).catch(()=>alert('Word: EXOTICCARE'));else alert('Word: EXOTICCARE')}
function start(){state.started=true;save();go(state.done.findIndex(x=>!x)<0?0:state.done.findIndex(x=>!x))}function go(i){state.mission=i;state.step=0;state.selected=null;state.feedback=null;save();render();window.scrollTo(0,0)}function home(){state.mission=-1;state.selected=null;state.feedback=null;save();render();window.scrollTo(0,0)}function choose(i){if(state.feedback)return;state.selected=i;render()}function submitDecision(){let m=missions[state.mission],t=m.tasks[state.step];if(state.selected===null||!m.evidence.some(e=>state.seen[e[1]]))return;let ok=state.selected===t.correct;state.feedback={ok,message:'This choice could miss a welfare concern or exceed the assistant’s role. Recheck the evidence and field guide, then choose the safest observation, action or report.'};render()}
function retry(){state.selected=null;state.feedback=null;render()}function nextStep(){if(!state.feedback||!state.feedback.ok)return;if(state.step<2){state.step++;state.selected=null;state.feedback=null;save();render();window.scrollTo(0,350)}else{state.done[state.mission]=true;state.feedback=null;state.selected=null;save();if(state.done.every(Boolean)){home()}else{let next=state.done.findIndex(x=>!x);go(next)}}}
function showModal(title,body){document.getElementById('overlay').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalheader"><h2>${esc(title)}</h2><button class="close" onclick="closeModal()">✕ Close</button></div><div class="modalbody">${body}</div></div></div>`}
function closeModal(){document.getElementById('overlay').innerHTML=''}function openDoc(key){state.seen[key]=true;save();let d=docs[key];let m=missions[state.mission];let body=`<img alt="Realistic clinical patient or facility image" src="${m.photo}"><div class="doc"><h3>${esc(d[0])}</h3>${d.slice(1).map(x=>`<p>• ${esc(x)}</p>`).join('')}</div><p class="muted">Training evidence for clinical reasoning. Always follow your supervisor's protocols in a real clinic.</p>`;showModal(d[0],body);render()}
function openGuide(){showModal('📖 Module 15 Clinical Field Guide',`<div class="doc"><h3>Species-specific reference</h3>${guide.map(x=>`<p>• ${esc(x)}</p>`).join('')}</div><p class="muted">Adapted from the Module 15 lessons and study guide. These are educational reminders, not independent treatment instructions.</p>`)}function openRole(){showModal('🛡️ Veterinary Assistant — Safety & Scope',`<div class="doc"><h3>Within the assistant role</h3><p>✓ Gather histories; observe posture, breathing, intake and behavior.</p><p>✓ Follow trained, supervised handling and approved husbandry procedures.</p><p>✓ Document objective facts and promptly notify the appropriate professional.</p><h3>Outside the assistant role</h3><p>✕ Diagnose illness or prescribe medications, diets or environmental changes independently.</p><p>✕ Use untrained restraint on distressed animals.</p><p>✕ Alter approved laboratory protocols or falsify records.</p><h3>When to stop immediately</h3><p>Bird open-mouth breathing during restraint; rabbit with marked lethargy and refusal to eat; severe stress or abnormal breathing; missing animal ID or suspected biosecurity breach.</p></div>`)}
render();
</script></body></html>
